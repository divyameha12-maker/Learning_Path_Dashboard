
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learner Login | Learning Path Dashboard</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            color: #243653;
            background:
                radial-gradient(circle at 10% 15%, #d9e8ff 0, transparent 35%),
                radial-gradient(circle at 90% 85%, #e6e1ff 0, transparent 35%),
                #f3f7ff;
        }

        .container { width: 100%; max-width: 440px; }

        .login-box {
            padding: 38px 36px;
            background: #fff;
            border: 1px solid #e7edfa;
            border-radius: 22px;
            box-shadow: 0 18px 50px rgba(35, 73, 130, .12);
        }

        .brand { text-align: center; margin-bottom: 28px; }

        .brand-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 68px;
            height: 68px;
            margin: 0 auto 16px;
            border-radius: 20px;
            background: linear-gradient(135deg, #e5efff, #eeebff);
            font-size: 34px;
        }

        .brand h1 {
            margin: 0;
            color: #203b68;
            font-size: 25px;
            line-height: 1.35;
        }

        .tagline { margin: 9px 0 0; color: #71809a; font-size: 14px; }

        .welcome-title {
            margin: 0 0 8px;
            text-align: center;
            font-size: 22px;
            color: #263a5b;
        }

        .subtitle {
            margin: 0 0 25px;
            text-align: center;
            color: #71809a;
            font-size: 14px;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 17px 0 8px;
            color: #344766;
            font-size: 14px;
            font-weight: bold;
        }

        .input-wrap { position: relative; }

        input {
            display: block;
            width: 100%;
            min-height: 48px;
            padding: 13px 14px;
            border: 1px solid #d8e1f0;
            border-radius: 10px;
            outline: none;
            background: #fbfcff;
            color: #243653;
            font-size: 14px;
        }

        input:focus {
            border-color: #3979e8;
            box-shadow: 0 0 0 3px rgba(57, 121, 232, .12);
        }

        input::placeholder { color: #9aa6b9; }
        .password-input { padding-right: 76px; }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            padding: 5px;
            border: none;
            background: transparent;
            color: #3268c5;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button {
            width: 100%;
            min-height: 49px;
            margin-top: 25px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(100deg, #3478e5, #4d64df);
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 7px 16px rgba(57, 105, 220, .2);
        }

        .login-button:hover { filter: brightness(1.06); }

        .error {
            margin-top: 17px;
            padding: 12px;
            border: 1px solid #ffd4d4;
            border-radius: 9px;
            background: #fff0f0;
            color: #b42332;
            font-size: 14px;
            line-height: 1.5;
        }

        .register-link {
            margin-top: 24px;
            text-align: center;
            color: #71809a;
            font-size: 14px;
        }

        .register-link a, .home-link {
            color: #326bd0;
            font-weight: bold;
            text-decoration: none;
        }

        .register-link a:hover, .home-link:hover { text-decoration: underline; }

        .home-link-wrap {
            margin-top: 19px;
            text-align: center;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            body { padding: 16px; }
            .login-box { padding: 30px 23px; border-radius: 18px; }
            .brand h1 { font-size: 22px; }
        }
    </style>
</head>

<body>
    <main class="container">
        <section class="login-box">
            <div class="brand">
                <div class="brand-icon" aria-hidden="true">🎓</div>
                <h1>Learning Path Dashboard</h1>
                <p class="tagline">Learn · Build · Grow</p>
            </div>

            <h2 class="welcome-title">Learner Login</h2>
            <p class="subtitle">
                Access your personalized learning paths and track your progress.
            </p>

            <form method="POST">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email"
                       autocomplete="username" required>

                <label for="password">Password</label>
                <div class="input-wrap">
                    <input type="password" id="password" name="password"
                           class="password-input"
                           placeholder="Enter your password"
                           autocomplete="current-password" required>
                    <button type="button" class="toggle-password"
                            id="togglePassword">Show</button>
                </div>

                <button type="submit" class="login-button">Login</button>
            </form>

            {% if error %}
            <div class="error" role="alert">{{ error }}</div>
            {% endif %}

            <div class="register-link">
                New learner?
                <a href="{{ url_for('learner_register') }}">Register here</a>
            </div>

            <div class="home-link-wrap">
                <a class="home-link" href="/">← Back to Home</a>
            </div>
        </section>
    </main>

    <script>
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");

        togglePassword.addEventListener("click", function () {
            const hidden = passwordInput.type === "password";
            passwordInput.type = hidden ? "text" : "password";
            togglePassword.textContent = hidden ? "Hide" : "Show";
        });
    </script>
</body>
</html>
