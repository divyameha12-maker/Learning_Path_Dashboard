<!DOCTYPE html>
<html>

<head>

    <title>Learner Login</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 450px;
            margin: 80px auto;
        }

        .login-box {
            background-color: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .login-button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .login-button:hover {
            background-color: #555;
        }

        .error {
            margin-top: 15px;
            padding: 10px;
            background-color: #ffe5e5;
            color: #b00020;
            border-radius: 5px;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            color: #333;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="login-box">

        <h1>Learner Login</h1>

        <form method="POST">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>

        </form>


        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


        <div class="register-link">

            <p>
                New learner?
                <a href="{{ url_for('learner_register') }}">
                    Register here
                </a>
            </p>

        </div>

    </div>

</div>

</body>

</html>
