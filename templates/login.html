<!DOCTYPE html>
<html>
<head>
    <title>Learning Path Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 900px;
            max-width: 90%;
            margin: 80px auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-container {
            display: flex;
            gap: 30px;
            justify-content: center;
        }

        .login-box {
            background: white;
            width: 400px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .login-box h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2878f0;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #125ac0;
        }

        .error {
            color: red;
            text-align: center;
        }

        .register {
            text-align: center;
            margin-top: 20px;
        }

        @media(max-width:700px) {
            .login-container {
                flex-direction: column;
                align-items: center;
            }

            .login-box {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Learning Path Dashboard</h1>

    <div class="login-container">

        <!-- INSTRUCTOR -->

        <div class="login-box">

            <h2>Instructor Login</h2>

            {% if instructor_error %}
                <p class="error">
                    {{ instructor_error }}
                </p>
            {% endif %}

            <form action="{{ url_for('instructor_login') }}" method="POST">

                <input
                    type="email"
                    name="email"
                    placeholder="Instructor Email"
                    required
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Instructor Login
                </button>

            </form>

            <div class="register">
                <a href="{{ url_for('register') }}">
                    Create Instructor Account
                </a>
            </div>

        </div>


        <!-- LEARNER -->

        <div class="login-box">

            <h2>Learner Login</h2>

            {% if learner_error %}
                <p class="error">
                    {{ learner_error }}
                </p>
            {% endif %}

            <form action="{{ url_for('learner_login') }}" method="POST">

                <input
                    type="email"
                    name="email"
                    placeholder="Learner Email"
                    required
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Learner Login
                </button>

            </form>

            <div class="register">
                <a href="{{ url_for('learner_register') }}">
                    Create Learner Account
                </a>
            </div>

        </div>

    </div>

</div>

</body>
</html>
