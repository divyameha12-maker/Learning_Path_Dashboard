<!DOCTYPE html>
<html>

<head>

    <title>Edit Academic Publication</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .form-box {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            margin-top: 25px;
            padding: 12px 20px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background-color: #555;
        }

        .back-button {
            display: inline-block;
            padding: 10px 18px;
            background-color: #777;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .error {
            color: red;
            margin-bottom: 15px;
        }

    </style>

</head>


<body>


<div class="container">


    <a
        class="back-button"
        href="{{ url_for('publications') }}"
    >
        ← Back to Academic Publications
    </a>


    <div class="form-box">

        <h1>
            Edit Academic Publication
        </h1>


        {% if error %}

            <p class="error">
                {{ error }}
            </p>

        {% endif %}


        <form
            method="POST"
            action="{{ url_for(
                'edit_publication',
                publication_id=publication['publication_id']
            ) }}"
        >


            <!-- TITLE -->

            <label for="title">
                Publication Title
            </label>

            <input
                type="text"
                id="title"
                name="title"
                value="{{ publication['title'] }}"
                required
            >


            <!-- AUTHORS -->

            <label for="authors">
                Authors
            </label>

            <input
                type="text"
                id="authors"
                name="authors"
                value="{{ publication['authors'] }}"
                required
            >


            <!-- YEAR -->

            <label for="year">
                Publication Year
            </label>

            <input
                type="number"
                id="year"
                name="year"
                value="{{ publication['year'] }}"
                min="1900"
                max="2100"
                required
            >


            <!-- TOPIC -->

            <label for="topic">
                Topic
            </label>

            <input
                type="text"
                id="topic"
                name="topic"
                value="{{ publication['topic'] }}"
                required
            >


            <!-- SOURCE -->

            <label for="source">
                Source Type
            </label>

            <select
                id="source"
                name="source"
                required
            >

                <option value="Journal"
                    {% if publication['source'] == 'Journal' %}
                        selected
                    {% endif %}
                >
                    Journal
                </option>

                <option value="Conference"
                    {% if publication['source'] == 'Conference' %}
                        selected
                    {% endif %}
                >
                    Conference
                </option>

                <option value="Book"
                    {% if publication['source'] == 'Book' %}
                        selected
                    {% endif %}
                >
                    Book
                </option>

                <option value="Research Paper"
                    {% if publication['source'] == 'Research Paper' %}
                        selected
                    {% endif %}
                >
                    Research Paper
                </option>

                <option value="Website"
                    {% if publication['source'] == 'Website' %}
                        selected
                    {% endif %}
                >
                    Website
                </option>

                <option value="Other"
                    {% if publication['source'] == 'Other' %}
                        selected
                    {% endif %}
                >
                    Other
                </option>

            </select>


            <!-- URL -->

            <label for="url">
                Publication URL
            </label>

            <input
                type="url"
                id="url"
                name="url"
                value="{{ publication['url'] or '' }}"
                placeholder="https://example.com"
            >


            <button type="submit">
                Update Publication
            </button>


        </form>

    </div>


</div>


</body>

</html>
